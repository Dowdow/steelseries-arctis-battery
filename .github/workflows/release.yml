name: "Release Build"

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: "windows-latest"
    steps:
      - uses: "actions/checkout@v4"

      - name: "Set up Go"
        uses: "actions/setup-go@v5"
        with:
          go-version: "stable"
          cache: true

      - name: "Download dependencies"
        run: go mod download

      - name: "Install rsrc"
        run: go install github.com/akavel/rsrc@v0.10.2

      - name: "Generate icon resource"
        run: rsrc -ico internal\icon\icon.ico -o rsrc.syso

      - name: "Build"
        run: |
          $env:GOARCH = "amd64"
          $env:GOOS = "windows"
          $env:CGO_ENABLED = "0"
          go build -ldflags="-H windowsgui" -o SteelSeriesArctisBattery_windows_amd64.exe

      - name: "Upload to Release"
        uses: "softprops/action-gh-release@v2"
        with:
          name: "Release ${{ github.ref_name }}"
          files: SteelSeriesArctisBattery_windows_amd64.exe
          draft: false
          prerelease: false

  build-linux:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"

      - name: "Set up Go"
        uses: "actions/setup-go@v5"
        with:
          go-version: "stable"
          cache: true

      - name: "Download dependencies"
        run: go mod download

      - name: "Build"
        run: CGO_ENABLED=0 GOARCH=amd64 go build -o SteelSeriesArctisBattery_linux_amd64

      - name: "Upload to Release"
        uses: "softprops/action-gh-release@v2"
        with:
          name: "Release ${{ github.ref_name }}"
          files: SteelSeriesArctisBattery_linux_amd64
          draft: false
          prerelease: false
